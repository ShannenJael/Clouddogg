services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8084:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
    restart: unless-stopped
